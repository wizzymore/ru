name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl = static binaries, run on any Linux distro
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          name=ru-${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" ru.exe
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" ru
            asset="$name.tar.gz"
          fi
          gh release upload "${{ github.event.release.tag_name }}" "$asset" --clobber --repo "${{ github.repository }}"
